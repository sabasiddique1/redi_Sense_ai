<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-grid" viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="ic-filesearch" viewBox="0 0 20 20"><rect x="3" y="2" width="10" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="13.5" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="15.8" y1="16.3" x2="18" y2="18.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-stethoscope" viewBox="0 0 20 20"><circle cx="15.5" cy="15.5" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 2v6a4 4 0 0 0 8 0V2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="5" y1="2" x2="5" y2="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="13" y1="2" x2="13" y2="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 12v2a4.5 4.5 0 0 0 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-user" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="10" y1="10" x2="10" y2="5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="10" y1="10" x2="13.2" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-book" viewBox="0 0 20 20"><path d="M2 3.5C3.5 2.6 6 2.5 9.5 4v13c-3.5-1.5-6-1.4-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18 3.5C16.5 2.6 14 2.5 10.5 4v13c3.5-1.5 6-1.4 7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="10" y1="1.8" x2="10" y2="4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="10" y1="15.8" x2="10" y2="18.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="1.8" y1="10" x2="4.2" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="15.8" y1="10" x2="18.2" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="4.2" x2="5.8" y2="5.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14.2" y1="14.2" x2="15.8" y2="15.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="4.2" y1="15.8" x2="5.8" y2="14.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14.2" y1="5.8" x2="15.8" y2="4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<aside style="width: {{ railWidth }}; flex-shrink:0; background: var(--rs-surface-raised); border-right:1px solid var(--rs-border-hairline); display:flex; flex-direction:column; padding: var(--rs-space-5) 0; font-family: var(--rs-font-sans); height:100%;">
  <div style="padding: 0 {{ logoPad }} var(--rs-space-5); font-size: var(--rs-text-lg); font-weight:700; letter-spacing:-0.01em; border-bottom:1px solid var(--rs-border-hairline); margin-bottom: var(--rs-space-4); color: var(--rs-ink-900); white-space:nowrap; overflow:hidden;">{{ logoLabel }}</div>
  <nav style="display:flex; flex-direction:column; gap: 2px; padding: 0 var(--rs-space-3);">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="7">
      <a href="#" title="{{ item.label }}" style="display:flex; align-items:center; gap: var(--rs-space-3); padding: 9px {{ item.pad }}; border-radius: var(--rs-radius-sm); background: {{ item.bg }}; color: {{ item.color }}; font-size: var(--rs-text-sm); font-weight: {{ item.weight }}; white-space:nowrap; justify-content: {{ item.justify }};">
        <svg width="18" height="18" style="flex-shrink:0;"><use href="{{ item.icon }}"></use></svg>
        <sc-if value="{{ item.showLabel }}" hint-placeholder-val="{{ true }}">{{ item.label }}</sc-if>
        <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ false }}">
          <span style="margin-left:auto; background: var(--rs-accent-600); color:white; font-size: var(--rs-text-2xs); font-weight:700; padding: 1px 6px; border-radius: var(--rs-radius-pill);">{{ item.badge }}</span>
        </sc-if>
      </a>
    </sc-for>
  </nav>
  <sc-if value="{{ showFooter }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:auto; padding: var(--rs-space-4) var(--rs-space-5) 0; font-size: var(--rs-text-2xs); color: var(--rs-ink-400); border-top:1px solid var(--rs-border-hairline); white-space:nowrap; overflow:hidden;">
      <div style="padding-top:var(--rs-space-3); display:flex; align-items:center; gap:8px;">
        <svg width="16" height="16" style="flex-shrink:0; color: var(--rs-ink-400);"><use href="#ic-user"></use></svg>
        <span>Dr. A. Reyes<br/>Radiology · Attending</span>
      </div>
    </div>
  </sc-if>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:700},&quot;activeItem&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Report Analyzer&quot;,&quot;Symptom Triage&quot;,&quot;Patient Profile&quot;,&quot;Timeline&quot;,&quot;Knowledge Center&quot;,&quot;Settings&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const collapsed = !!this.props.collapsed;
    const active = this.props.activeItem || 'Dashboard';
    const defs = [
      ['Dashboard', '#ic-grid', 4],
      ['Report Analyzer', '#ic-filesearch', 3],
      ['Symptom Triage', '#ic-stethoscope', 0],
      ['Patient Profile', '#ic-user', 0],
      ['Timeline', '#ic-clock', 0],
      ['Knowledge Center', '#ic-book', 0],
      ['Settings', '#ic-settings', 0],
    ];
    const items = defs.map(([label, icon, badge]) => {
      const isActive = label === active;
      return {
        label, icon, badge: badge || null,
        showLabel: !collapsed,
        justify: collapsed ? 'center' : 'flex-start',
        pad: collapsed ? '9px' : 'var(--rs-space-3)',
        bg: isActive ? 'var(--rs-accent-050)' : 'transparent',
        color: isActive ? 'var(--rs-accent-700)' : 'var(--rs-ink-700)',
        weight: isActive ? '600' : '400',
      };
    });
    return {
      items,
      railWidth: collapsed ? '64px' : '240px',
      logoPad: collapsed ? '0' : 'var(--rs-space-5)',
      logoLabel: collapsed ? 'RS' : 'RediSense',
      showFooter: !collapsed,
    };
  }
}

</script>
</body>
</html>
